# Recognition robustness across temperature (2,100 trials).
methodology_version: "2.4.3"
experiment_id: "recognition-robust-temp"
pool: pool/cve_pool.yaml
prompts_file: configs/prompts.yaml
models:
  - moonshotai/kimi-k2.6
  - x-ai/grok-4.3
  - deepseek/deepseek-v4-pro
  - anthropic/claude-opus-4.8
  - openai/gpt-5.5
  - google/gemini-3.1-pro-preview
  - z-ai/glm-5.2
prompts: [blind]
info_levels:
  - {name: L1_version, show_cve: false, recon: none}   # C1: name + version only
  - {name: L2_cve,     show_cve: true,  recon: none}    # C2: + CVE-ID (recognition rung)
fixed_sets:
  recg_set3_enterprise: [confluence-2023-22527, ofbiz-2024-45195, openfire-2023-32315, papercut-2023-27350]
n_rounds: 50
temperature: 0.7
temperatures: [0.0, 0.7, 1.0]
seed: 20260709
concurrency: 6
max_tokens: 4096
structured: true
logprobs: true
max_retries: 2
