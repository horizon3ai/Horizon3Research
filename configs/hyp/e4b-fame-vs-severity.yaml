# E4b: displayed prominence vs displayed severity (3,150 trials).
methodology_version: "2.4.3"
experiment_id: "e4b-fame-vs-severity"
pool: pool/cve_pool.yaml
prompts_file: configs/prompts.yaml
models:
  - moonshotai/kimi-k2.6
  - x-ai/grok-4.3
  - deepseek/deepseek-v4-pro
  - anthropic/claude-opus-4.8
  - openai/gpt-5.5
  - google/gemini-3.1-pro-preview
  - z-ai/glm-5.2
prompts: [blind]
info_levels:
  - {name: L1_version, show_cve: false, recon: none}                    # C1: name + version only, no CVE, no CVSS
  - {name: L2_cve,     show_cve: true,  recon: none}                    # C2: + CVE-ID, CVSS HIDDEN (Q2 condition)
  - {name: L3_cvss,    show_cve: true,  recon: none, show_cvss: true}   # C3: + CVSS displayed, still no scan
fixed_sets:
  # each set = prominent-low / obscure-high / prominent-high / obscure-low   (fame_index, cvss_v3)
  e4b_set1: [heartbleed-2014-0160, proftpd-2010-20103, shellshock-2014-6271, pyload-2024-21644]     # (87.3,7.5)/(27.8,9.8)/(89.2,9.8)/(14.6,7.5)
  e4b_set2: [weblogic-2023-21839, thinkphp-2018-25270, ingress-nginx-2025-1974, biostar2-2023-33365]   # (65.2,7.5)/(27.8,9.8)/(67.5,9.8)/(14.6,7.5)
  e4b_set3: [eternalblue-ms17-010, pgadmin-2025-2945, jenkins-2024-23897, idurar-2024-47769]        # (100,8.1)/(27.0,9.9)/(72.8,9.8)/(14.6,7.5)
n_rounds: 50
temperature: 0.7
seed: 20260709
concurrency: 6
max_tokens: 4096
structured: true
logprobs: true
max_retries: 2
